---
# The Jenkins image is built from the repo's jenkins/image directory (same image as
# local mode), so local and AWS Jenkins are identical: plugins + JCasC baked in.
jenkins_build_context: "{{ playbook_dir }}/../jenkins/image"
jenkins_image_name: sentinelops-jenkins
jenkins_image_tag: local
jenkins_port: 8080
jenkins_dir: "{{ sentinelops_base_dir }}/jenkins"
jenkins_mode: aws
jenkins_git_repo_url: https://github.com/rohan-0024/sentinelops.git
jenkins_sonar_host_url: "http://sonarqube:9000"
jenkins_wait_for_up: true
