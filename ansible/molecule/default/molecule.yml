---
# Molecule test for the CI-host roles in an Ubuntu 22.04 container (no systemd; see Dockerfile).
# Run from ansible/:  molecule test     (or `make ansible-test` from the repo root)
dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/../../requirements.yml
driver:
  name: docker
platforms:
  - name: sentinelops-ci-test
    image: sentinelops-molecule-jammy
    dockerfile: Dockerfile
    pre_build_image: false
    command: sleep infinity
provisioner:
  name: ansible
  # Molecule's project dir is the git root, so point at ansible/roles explicitly.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_SCENARIO_DIRECTORY}/../../roles
  inventory:
    group_vars:
      all:
        sentinelops_base_dir: /opt/sentinelops
        hardening_firewall_enabled: false # no netfilter inside the test container
        hardening_apply_sysctl: false # host kernel params are read-only in containers
        docker_manage_service: false # no nested dockerd
        node_exporter_manage_service: false # no systemd; verify.yml starts the binary directly
        trivy_download_db: false # keep the test fast and offline-friendly
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
