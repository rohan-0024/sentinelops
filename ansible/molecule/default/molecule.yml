---
# Molecule test for the CI-host roles in a systemd-enabled Ubuntu 22.04 container.
# Run from ansible/:  molecule test     (or `make ansible-test` from the repo root)
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
driver:
  name: docker
platforms:
  - name: sentinelops-ci-test
    image: sentinelops-molecule-jammy
    dockerfile: Dockerfile
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
provisioner:
  name: ansible
  config_options:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/roles
  inventory:
    group_vars:
      all:
        sentinelops_base_dir: /opt/sentinelops
        hardening_firewall_enabled: false # no netfilter inside the test container
        hardening_apply_sysctl: false # host kernel params are read-only in containers
        docker_manage_service: false # no nested dockerd
        trivy_download_db: false # keep the test fast and offline-friendly
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy
