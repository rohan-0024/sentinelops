# checkov config for `make iac-scan`. Directories are added as phases land.
directory:
  - docker
  - terraform
  - jenkins/image
  - k8s
skip-path:
  - k8s/charts/sentinelops-policies
framework:
  - dockerfile
  - terraform
  - kubernetes
  - helm
compact: true
quiet: true
output:
  - cli
soft-fail: false
skip-download: true
