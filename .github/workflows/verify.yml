# Cloud CI mirror of `make verify` (lint, Ansible lint, unit tests, tool tests, checkov,
# promtool/amtool, helm lint) plus a gitleaks history scan. Jenkins remains the delivery
# pipeline; this workflow gives the README a real, public build badge.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
      - name: Pinned CLI tools (versions.env)
        run: TOOLS="gitleaks conftest helm" bash scripts/install-tools.sh
      - name: Secret scan (full history)
        run: .bin/gitleaks git --redact --no-banner --exit-code 1 .
      - name: make verify
        run: make verify
