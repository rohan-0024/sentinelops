{{- if .Values.analysis.enabled }}
# SLO analysis for the canary revision only (pods carry rollouts-pod-template-hash,
# exported to Prometheus by the PodMonitor as rollouts_pod_template_hash).
# No traffic yet -> empty/NaN result -> treated as passing; the load generator
# keeps a steady request stream during rollouts.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ include "app.name" . }}-slo
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  args:
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: {{ .Values.analysis.interval }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] <= {{ .Values.analysis.maxErrorRate }}"
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            sum(rate(http_requests_total{namespace="{{ include "app.namespace" . }}",rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}",status=~"5.."}[1m]))
            /
            sum(rate(http_requests_total{namespace="{{ include "app.namespace" . }}",rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[1m]))
    - name: p95-latency
      interval: {{ .Values.analysis.interval }}
      failureLimit: {{ .Values.analysis.failureLimit }}
      successCondition: "len(result) == 0 || isNaN(result[0]) || result[0] <= {{ .Values.analysis.maxP95LatencySeconds }}"
      provider:
        prometheus:
          address: {{ .Values.analysis.prometheusAddress }}
          query: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="{{ include "app.namespace" . }}",rollouts_pod_template_hash="{{ "{{" }}args.canary-hash{{ "}}" }}"}[1m])))
{{- end }}
