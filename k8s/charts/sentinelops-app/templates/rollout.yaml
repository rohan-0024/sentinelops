apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "app.name" . }}
  namespace: {{ include "app.namespace" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 5
  # Fail fast (default 600 s) when pods cannot be created, e.g. rejected at admission.
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  strategy:
    canary:
      canaryMetadata:
        labels:
          role: canary
      stableMetadata:
        labels:
          role: stable
      abortScaleDownDelaySeconds: 30
      {{- if .Values.analysis.enabled }}
      # Background analysis runs from the first step until promotion; any failure
      # aborts the rollout and Argo Rollouts restores the stable ReplicaSet.
      analysis:
        startingStep: 1
        templates:
          - templateName: {{ include "app.name" . }}-slo
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      {{- end }}
      steps:
        {{- range .Values.canary.steps }}
        - setWeight: {{ . }}
        - pause: { duration: {{ $.Values.canary.pauseSeconds }}s }
        {{- end }}
        - setWeight: 100
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: sentinelops
    spec:
      serviceAccountName: {{ include "app.name" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: {{ include "app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: {{ .Values.env | quote }}
            - name: FAULT_ERROR_RATE
              value: {{ .Values.fault.errorRate | quote }}
            - name: FAULT_LATENCY_MS
              value: {{ .Values.fault.latencyMs | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
