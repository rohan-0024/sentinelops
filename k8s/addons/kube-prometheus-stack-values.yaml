# kube-prometheus-stack for local mode: small footprint, NodePorts, no persistence.
# Phase 6 adds SentinelOps rules, Alertmanager routes and provisioned dashboards.
fullnameOverride: kps

prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Discover ServiceMonitors/PodMonitors/rules from every namespace (app, pushgateway, rollouts).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

alertmanager:
  service:
    type: NodePort
    nodePort: 30093
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

grafana:
  service:
    type: NodePort
    nodePort: 30300
  adminUser: admin
  # Password comes from a Secret created by scripts/cluster-addons.sh (GRAFANA_ADMIN_PASSWORD in .env).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 256Mi }
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

prometheus-node-exporter:
  # kind on Docker Desktop (WSL2): the host root FS is not a shared mount, so the
  # default rootfs mount with HostToContainer propagation makes node-exporter crash-loop.
  hostRootFsMount:
    enabled: false
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

# kind's control-plane components are not reachable for scraping; avoid noisy down targets.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
