# Kyverno admission controller, single replicas for a laptop cluster.
admissionController:
  replicas: 1
  # Expose admission decisions per policy to Prometheus.
  serviceMonitor:
    enabled: true
  container:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
backgroundController:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
cleanupController:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
reportsController:
  replicas: 1
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }
