# SonarQube analysis settings (projectKey/version are passed by the Jenkinsfile).
sonar.projectKey=sentinelops-app
sonar.projectName=SentinelOps App
sonar.sourceEncoding=UTF-8
sonar.sources=app/sentinel_app
sonar.tests=app/tests
sonar.python.version=3.11
sonar.python.coverage.reportPaths=app/coverage.xml
sonar.python.xunit.reportPath=reports/junit-app.xml
sonar.exclusions=**/__pycache__/**
